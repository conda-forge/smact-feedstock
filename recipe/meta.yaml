{% set name = "smact" %}
{% set version = "4.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f2372e9127565a298e3a49a0b0488bd3cf67b6a591b6ebb752f8b9ce25736a68

build:
  number: 2

outputs:
  - name: {{ name|lower }}
    build:
      noarch: python
      script: $PYTHON -m pip install . -vv
    requirements:
      host:
        - python
        - setuptools >=77.0.0
        - pip
        - numpy
      run:
        - python <=3.14
        - scipy
        - numpy <3
        - spglib >=2.6.0
        - pymatgen >=2024.2.20
        - ase
        - pandas
        - pathos
        - pandarallel >=1.6.5
        - tabulate
        - tqdm
        - typing-extensions
    test:
      imports:
        - smact
      commands:
        - pip check
      requires:
        - pip
        - python

  # The following noarch meta-packages mirror SMACT's public runtime extras.
  # They deliberately use conda package names (for example, pytorch rather
  # than the PyPI name torch) and allow users to select only the functionality
  # they need.
  - name: smact-mp
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact", exact=True) }}
        - mp-api >=0.45.3
    test:
      commands:
        - python -c "from mp_api.client import MPRester"
      requires:
        - python

  - name: smact-crystal-space
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact-mp", exact=True) }}
        - elementembeddings >=0.4
        - umap-learn ==0.5.7
        - python-kaleido >=0.2.1
    test:
      commands:
        - python -c "import elementembeddings, umap"
      requires:
        - python

  - name: smact-featurisers
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact", exact=True) }}
        - matminer
        - elementembeddings
    test:
      commands:
        - python -c "import matminer, elementembeddings"
      requires:
        - python

  - name: smact-visualisation
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact", exact=True) }}
        - seaborn >=0.13.2
        - pymatviz >=0.15
        - dash >=2.18.2
    test:
      commands:
        - python -c "import dash, pymatviz, seaborn"
      requires:
        - python

  - name: smact-ml
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact-featurisers", exact=True) }}
        - xgboost
        - shap
    test:
      commands:
        - python -c "import shap, xgboost"
      requires:
        - python

  - name: smact-property-prediction
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact", exact=True) }}
        # aviary-models must be available from conda-forge before this output
        # can be built. Do not replace it with a pip installation: that would
        # make the environment unsafely mutable after conda solves it.
        - aviary-models >=1.2.1
        - pytorch >=2.0.0,<2.11
        - requests
    test:
      commands:
        - python -c "import torch; from aviary.roost.model import Roost; from smact.property_prediction import RoostPropertyPredictor"
      requires:
        - python

  - name: smact-optional
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("smact-mp", exact=True) }}
        - {{ pin_subpackage("smact-visualisation", exact=True) }}
        - {{ pin_subpackage("smact-ml", exact=True) }}
        - pydantic >=2.9.2
        - matminer >=0.9.2
        - python-kaleido >=0.2.1
        - llvmlite >=0.40
        # `matplotlib-venn[shapely]` is a PyPI extra. Conda represents the
        # same request as the package and its optional dependency separately.
        - matplotlib-venn >=1.1.2
        - shapely
    test:
      commands:
        - python -c "import llvmlite, matplotlib_venn, pydantic, shapely"
      requires:
        - python

about:
  home: https://github.com/WMD-group/SMACT
  summary: Python package to aid materials design and informatics
  description: |
    Semiconducting Materials by Analogy and Chemical Theory (SMACT)
    is a collection of rapid screening tools that uses data about chemical elements.
  license: MIT
  license_file: LICENSE
  doc_url: https://smact.readthedocs.io/en/latest/
  dev_url: https://github.com/WMD-group/SMACT

extra:
  recipe-maintainers:
    - AntObi
    - KingaMas
    - aronwalsh
